<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Puppy Archive：按人建档，记录信息、事件、局记录与技能树。无需注册账号，本机即用，可选云端同步。">
<meta name="robots" content="noindex, nofollow">
<title>Puppy Archive</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="application-name" content="Puppy Archive">
<meta name="apple-mobile-web-app-title" content="Puppy Archive">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f4f1">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161513">
<style>
:root{
  --bg:#f5f4f1;--card:#fff;--ink:#222;--sub:#716d66;--line:#e6e3dd;
  --accent:#9e4a26;--accent-soft:#f6e6dd;--ok:#3d7a4f;--warn:#8f5b12;--bad:#b23a3a;--info:#3b6ea5;
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161513;--card:#201f1c;--ink:#ece9e3;--sub:#9b968c;--line:#34322d;--accent:#e08a5f;--accent-soft:#3a2a21;--ok:#6fbf86;--warn:#e0b25a;--bad:#e27b7b;--info:#7fb0e6}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:720px;margin:0 auto;padding:0 14px calc(84px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:10px;padding:14px 2px 8px;position:sticky;top:0;background:var(--bg);z-index:5}
header.top h1{font-size:18px;margin:0;flex:1}
header.top select{max-width:46%}
h2{font-size:15px;margin:20px 2px 8px;color:var(--sub);font-weight:600;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:flex-start}
.row.c{align-items:center}
.grow{flex:1;min-width:0}
.sub{color:var(--sub);font-size:13px}
.tiny{font-size:12px;color:var(--sub)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 13px;cursor:pointer}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.sm{padding:3px 9px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
textarea{min-height:84px;resize:vertical}
label.f{display:block;margin:10px 0 3px;font-size:13px;color:var(--sub)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.tag.stated{color:var(--ok);border-color:var(--ok)}
.tag.observed{color:var(--info);border-color:var(--info)}
.tag.inferred{color:var(--warn);border-color:var(--warn)}
.tag.unverified{color:var(--bad);border-color:var(--bad)}
.tag.lv{background:var(--accent-soft);color:var(--accent);border-color:transparent}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.bar .in{display:flex;width:100%;max-width:720px}
nav.bar button{flex:1;border:0;background:none;padding:10px 0 9px;font-size:12px;color:var(--sub);cursor:pointer;position:relative}
nav.bar button.on{color:var(--accent);font-weight:600}
nav.bar button .n{position:absolute;top:4px;margin-left:2px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:0 5px}
.bar-out{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar-out i{display:block;height:100%;background:var(--accent)}
.st{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.st button{border:1px solid var(--line);background:none;border-radius:8px;padding:2px 9px;font-size:12px;cursor:pointer;color:var(--sub)}
.st button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.st button.on.dropped{background:var(--sub);border-color:var(--sub)}
.skill.dropped{opacity:.55}
.bubble{max-width:82%;padding:6px 11px;border-radius:14px;margin:4px 0;white-space:pre-wrap;word-break:break-word}
.bubble.dog{background:var(--accent-soft);border-bottom-left-radius:4px}
.bubble.me{background:var(--line);margin-left:auto;border-bottom-right-radius:4px}
.chat{display:flex;flex-direction:column}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.modal h3{margin:0 0 4px}
/* 对话框 / 菜单（替代浏览器原生弹窗） */
#dlgRoot .modal{z-index:26;background:rgba(0,0,0,.42)}
.dlg-body{margin:6px 0 0;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.btn.solid-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.solid-ok{background:var(--accent);border-color:var(--accent);color:#fff}
.menu{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.menu button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:15px;cursor:pointer}
.menu button .ic{width:20px;flex:none;text-align:center;font-size:15px;opacity:.85}
.menu button .mt{display:flex;flex-direction:column;gap:1px;min-width:0}
.menu button .mt i{font-style:normal;font-size:12px;color:var(--sub)}
.menu button.bad{color:var(--bad)}
/* 手势卡片 */
.gest{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);background:var(--card);margin-bottom:10px}
.gest .g-act{position:absolute;top:0;right:0;bottom:0;display:flex;z-index:1}
.gest .g-act button{width:72px;border:0;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;background:var(--sub);cursor:pointer}
.gest .g-act button.warn{background:var(--warn)}
.gest .g-act button.bad{background:var(--bad)}
.gest .g-act button.ok{background:var(--ok)}
.gest .g-in{position:relative;z-index:2;background:var(--card);padding:12px 14px;transition:transform .19s ease;-webkit-user-select:none;user-select:none;touch-action:pan-y}
.gest.dragging .g-in{transition:none}
.gest.open .g-in{box-shadow:-6px 0 14px rgba(0,0,0,.08)}
.gest.pressing .g-in{background:var(--accent-soft)}
.gest.plain{border:0;border-top:1px solid var(--line);border-radius:0;background:none;margin:0}
.gest.plain:first-child{border-top:0}
.gest.plain .g-in{background:var(--card);padding:9px 0}
/* 长按拖动排序 */
.gest .g-in{-webkit-touch-callout:none}
.gest.drag-src{opacity:.32;border-style:dashed}
.gest.drag-src .g-in{background:var(--accent-soft)}
.drag-ghost{position:fixed;z-index:40;pointer-events:none;margin:0;background:var(--card);
  box-shadow:0 14px 32px rgba(0,0,0,.22);will-change:transform}
.drag-ghost .g-act{display:none}
body.dragging-row{-webkit-user-select:none;user-select:none;cursor:grabbing}
.hint{display:flex;align-items:center;gap:6px;margin:0 2px 9px;color:var(--sub);font-size:12px}
.hint button{margin-left:auto;border:0;background:none;color:var(--sub);font-size:16px;line-height:1;padding:0 4px;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#222;color:#fff;padding:8px 16px;border-radius:99px;z-index:30;font-size:14px;max-width:90vw}
.empty{text-align:center;color:var(--sub);padding:26px 0}
.sec-h{display:flex;align-items:center;justify-content:space-between}
.kv{display:flex;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .k{width:88px;flex:none;color:var(--sub);font-size:13px;padding-top:1px}
.kv.old .v{text-decoration:line-through;color:var(--sub)}
.checkbox{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--accent)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:13px;background:var(--card)}
.checks input{width:auto}
#login{max-width:420px;margin:0 auto;padding:12vh 18px 30px}
#login h1{margin:0 0 4px}
#login .logo{display:block;width:64px;height:64px;margin:0 0 10px}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
pre.json{white-space:pre-wrap;word-break:break-all;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px;max-height:260px;overflow:auto}
.hide{display:none!important}
input.code{text-align:center;font-size:26px;letter-spacing:.42em;text-indent:.42em;font-family:ui-monospace,Menlo,monospace;font-weight:700;padding:10px 0}
</style>
</head>
<body>

<main>
<div id="login">
  <img class="logo" src="icon-180.png" alt="Puppy Archive" width="64" height="64">
  <h1>Puppy Archive</h1>
  <p class="sub" id="lgStatus">正在加载…</p>
  <div id="lgBody" class="hide">
    <div class="card">
      <b>口令</b>
      <p class="sub" style="margin:6px 0 10px">4 位数字，自己定一个记得住的。没有账号、没有密码；换设备或清了浏览器数据，输入同一串数字就能找回全部档案。忘了就找不回来了。</p>
      <input id="rcInput" class="code" type="tel" inputmode="numeric" maxlength="4" placeholder="4 位数字" autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="row" style="margin-top:10px">
        <button class="btn pri grow" id="btnNew" type="button">新建档案库</button>
        <button class="btn grow" id="btnRestore" type="button">找回档案</button>
      </div>
      <p class="sub" id="rcMsg" style="margin:8px 0 0"></p>
    </div>
    <div class="err" id="lgErr" style="white-space:pre-wrap;word-break:break-word"></div>
  </div>
</div>

<div id="app" class="hide"></div>
</main>
<div id="modalRoot"></div>
<div id="dlgRoot"></div>

<script>
/* ===== 网络诊断：先于 SDK 安装，记录所有登录/数据请求，用于定位失败环节 ===== */
window.__net = [];
(function(){
  const raw = window.fetch ? window.fetch.bind(window) : null;
  if (!raw) return;
  const cut = u => { const i = u.indexOf('?'); return i < 0 ? u : u.slice(0, i); };
  const push = r => {
    try {
      window.__net.push(r);
      if (window.__net.length > 12) window.__net.shift();
      sessionStorage.setItem('__net', JSON.stringify(window.__net));
    } catch (e) {}
  };
  window.fetch = async function(input, init){
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    const isCloud = url.indexOf('/.cloud/') !== -1 || url.indexOf('genie-baas') !== -1;
    const t0 = Date.now();
    let resp;
    try {
      resp = await raw(input, init);
    } catch (e) {
      if (isCloud) push({ url: cut(url), status: 0, statusText: 'NETWORK', msg: String((e && e.message) || e) });
      throw e;
    }
    if (isCloud){
      const rec = { url: cut(url), status: resp.status, statusText: resp.statusText, ms: Date.now() - t0 };
      try {
        rec.rid = resp.headers.get('x-request-id');
        rec.tid = resp.headers.get('x-trace-id');
      } catch (e) {}
      try {
        const t = await resp.clone().text();
        rec.body = t.slice(0, 200);
      } catch (e) {}
      push(rec);
    }
    return resp;
  };
  try {
    const saved = sessionStorage.getItem('__net');
    if (saved) window.__net = JSON.parse(saved);
  } catch (e) {}
})();
</script>
<script src="config.js"></script>
<script>
/* ===== SDK 按需加载 =====
   sdk.js 是云端同步 SDK（约 70KB），只有配置了云端才需要。
   「仅本机」模式下完全不下载，省掉一次传输与解析。 */
window.__sdkReady = (function(){
  const c = window.PA_CONFIG || {};
  if (!(c.endpoint && c.publishableKey)) return Promise.resolve(false);
  return new Promise(res => {
    const s = document.createElement('script');
    s.src = 'sdk.js';
    s.async = false;
    s.onload = () => res(true);
    s.onerror = () => res(false);
    document.head.appendChild(s);
  });
})();
</script>
<script>
/* ========== 配置 ==========
   云端连接参数放在 config.js（window.PA_CONFIG），代码里不留密钥。
   没有 config.js 或值为空时，应用自动以「仅本机」模式运行，功能照常、不同步。 */
const publicConfig = window.PA_CONFIG || {};
const cloudReady = !!(publicConfig.endpoint && publicConfig.publishableKey);

/* ========== 通用模板（技能树 + 档案字段） ========== */
const TEMPLATE = {
  version: 1,
  levels: { 1:'L1 基础', 2:'L2 进阶', 3:'L3 高控制', 4:'L4 深度' },
  skills: [
    {k:'l1_stop',   lv:1, name:'寸止叫停',       hint:'临界点叫停，不放行；先练节奏和听令'},
    {k:'l1_reward', lv:1, name:'基础奖惩',       hint:'完成指令给放行/加速，失败给减速/暂停'},
    {k:'l1_count',  lv:1, name:'报数',           hint:'按要求报数、报状态，用于校准控制'},
    {k:'l1_address',lv:1, name:'称呼规则',       hint:'约定称呼与说话规则'},
    {k:'l1_safe',   lv:1, name:'安全词与 Aftercare', hint:'安全词、叫停方式、事后安抚'},
    {k:'l2_dice',   lv:2, name:'骰子 / 盲盒',    hint:'随机决定指令或结果，增加不可预测性'},
    {k:'l2_shop',   lv:2, name:'积分商店与免罚券', hint:'表现换积分，积分换权益或免罚'},
    {k:'l2_mute',   lv:2, name:'禁声',           hint:'限制发声，用其他方式回应'},
    {k:'l2_freeze', lv:2, name:'冻结指令',       hint:'一声令下立刻停住不动'},
    {k:'l2_temp',   lv:2, name:'温度与材质',     hint:'冷热、材质带来的不同感受'},
    {k:'l3_blind',  lv:3, name:'蒙眼与黑暗',     hint:'感官剥夺，依赖声音指引'},
    {k:'l3_overload',lv:3,name:'认知过载',       hint:'同时多条指令或计算任务，占满注意力'},
    {k:'l3_light',  lv:3, name:'红绿灯自主计时', hint:'给出规则后由对方自己计时和自控'},
    {k:'l3_nohand', lv:3, name:'禁止自己动手',   hint:'全程不得自行触碰，只能按指令'},
    {k:'l3_mirror', lv:3, name:'镜面描述',       hint:'让对方描述自己当下的状态和样子'},
    {k:'l3_role',   lv:3, name:'角色剧本',       hint:'带情节和身份设定的玩法'},
    {k:'l4_fake',   lv:4, name:'虚晃一枪',       hint:'假装放行或假装结束，再收回'},
    {k:'l4_blindend',lv:4,name:'盲盒终点',       hint:'终点结果随机，对方事先不知道'},
    {k:'l4_candy',  lv:4, name:'糖果诱饵',       hint:'用奖励做诱饵引导犯错'},
    {k:'l4_cross',  lv:4, name:'跨局剥夺',       hint:'跨多局不放行，延后释放'},
    {k:'l4_raid',   lv:4, name:'日常突袭',       hint:'脱离固定时间突然开局或下指令'},
    {k:'l4_tease',  lv:4, name:'预告不兑现',     hint:'先预告再按兵不动，制造期待'},
    {k:'l4_cond',   lv:4, name:'条件反射词',     hint:'特定词语触发既定反应'},
    {k:'l4_async',  lv:4, name:'异步指令',       hint:'不同时在线时留下指令，事后汇报'}
  ],
  factCategories: {
    person: ['基础','学业与生活','作息与环境','声音与表达','偏好','雷区与禁忌','健康与安全','平台与联系'],
    session: ['姿势动作','道具','节奏','局内反应']
  },
  confidence: { stated:'亲口说', observed:'观察到', inferred:'推测', unverified:'待确认' },
  skillStatus: { untried:'未尝试', tried:'已尝试', mastered:'已掌握', dropped:'淘汰' }
};
const DIM = { person:'个人维度', session:'局内维度' };

/* ========== 工具 ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const nowISO = () => new Date().toISOString();
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

let cloud = null;
const S = { dogs:[], dog:null, facts:[], skills:[], sessions:[], events:[], pending:[], tab:'home', openSession:null, showOld:false, evFilter:'all', showCode:false, hintOff:false };
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* 任何错误都展开成人能读的文字，绝不出现 [object Object] */
function errText(e){
  if (e == null) return '未知错误';
  if (typeof e === 'string') return e;
  const parts = [];
  const add = (k, v) => {
    if (v === undefined || v === null || v === '' || v === 'null') return;
    const s = typeof v === 'object' ? JSON.stringify(v) : String(v);
    parts.push(k ? k + '：' + s : s);
  };
  add('', e.message || e.msg || e.error_description);
  add('错误码', e.code || e.error);
  add('详情', e.details);
  add('提示', e.hint);
  add('HTTP', e.status || e.statusCode);
  add('追踪号', e.requestId || e.request_id);
  if (parts.length) return parts.join('\n');
  try { const j = JSON.stringify(e); if (j && j !== '{}') return j; } catch (x) {}
  return String(e && e.name || '未知错误');
}
function netDiag(){
  const list = (window.__net || []).slice(-3);
  if (!list.length) return '';
  const lines = list.map(r => {
    const head = `${r.status || 'ERR'} ${r.statusText || ''}`.trim() + ' ' + r.url;
    const meta = [r.rid ? 'rid=' + r.rid : '', r.ms ? r.ms + 'ms' : '', r.msg || ''].filter(Boolean).join(' ');
    return '· ' + head + (meta ? '\n  ' + meta : '');
  });
  return '\n\n【请求诊断】\n' + lines.join('\n');
}

/* ========== 本机库：与云端同构的单个 JSON 文档 ========== */
const LS_KEY = 'pa_store_v1';
const COLS = {
  dogs:['id','code','real_name','status','note','created_at','updated_at'],
  facts:['id','dog_id','dimension','category','key','value','source','confidence','observed_on','session_id','superseded','note','sort','created_at','updated_at'],
  dog_skills:['id','dog_id','skill_key','level','name','status','first_date','effect','quote','feasible','feasible_note','sort','created_at','updated_at'],
  sessions:['id','dog_id','seq','session_date','type','format','env','duration_min','summary','chat','report','skills_used','sort','created_at','updated_at'],
  events:['id','dog_id','session_id','kind','title','detail','event_date','due_date','done','done_at','source','sort','created_at','updated_at'],
  pending:['id','dog_id','proposed_by','target_table','action','target_id','payload','reason','status','created_at','resolved_at'],
  attachments:['id','dog_id','session_id','kind','name','storage_key','meta','created_at']
};
const DEFAULTS = {
  dogs:{status:'active'}, facts:{dimension:'person',category:'basic',confidence:'stated',superseded:false},
  dog_skills:{level:1,status:'untried'}, sessions:{type:'play'}, events:{kind:'event',done:false},
  pending:{proposed_by:'agent',action:'insert',status:'open'}, attachments:{kind:'image'}
};
let STORE = null;   // { code, hash, rev, dirty, ver, syncedAt, db:{tables,seq} }
let UPGRADING = false;   // 旧口令换成新口令时为 true，保留本机数据

function emptyDB(){ const db = { tables:{}, seq:{} }; for (const t in COLS){ db.tables[t] = []; db.seq[t] = 0; } return db; }
function normDB(db){
  if (!db || typeof db !== 'object' || !db.tables) throw new Error('数据格式不对');
  db.seq = db.seq || {};
  for (const t in COLS){
    db.tables[t] = db.tables[t] || [];
    const mx = db.tables[t].reduce((m, r) => Math.max(m, Number(r.id) || 0), 0);
    db.seq[t] = Math.max(Number(db.seq[t]) || 0, mx);
  }
  return db;
}
function loadStore(){
  try { const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (s && s.hash && s.db){ normDB(s.db); return s; } } catch (e) { console.error(e); }
  return null;
}
function saveStore(){ try { localStorage.setItem(LS_KEY, JSON.stringify(STORE)); } catch (e) { toast('本机存储失败：' + errText(e)); } }
function touch(){ STORE.dirty = true; STORE.ver = (STORE.ver || 0) + 1; saveStore(); setSync('pending'); scheduleSync(1500); }

const clone = x => x === undefined ? x : JSON.parse(JSON.stringify(x));
const cmp = (a, b) => (a == null && b == null) ? 0 : a == null ? 1 : b == null ? -1 : a < b ? -1 : a > b ? 1 : 0;
function canon(v){   // 键排序后的稳定序列化，用来比较两份 JSON 是否相同
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
}

/* 查询构造器：保留 select / insert / update / delete / eq / order 的写法，数据落在本机 */
class Q {
  constructor(t){ this.t = t; this.op = 'select'; this.f = []; this.ord = null; this.cols = null; this.pl = null; this.rows = false; }
  select(c){ if (this.op === 'select') this.cols = c; else this.rows = true; return this; }
  insert(p){ this.op = 'insert'; this.pl = p; return this; }
  update(p){ this.op = 'update'; this.pl = p; return this; }
  delete(){ this.op = 'delete'; return this; }
  eq(k, v){ this.f.push([k, v]); return this; }
  order(k, o){ this.ord = [k, !(o && o.ascending === false)]; return this; }
  then(a, b){ return this.run().then(a, b); }
  run(){
    try { return Promise.resolve({ data: this.exec(), error: null }); }
    catch (e) { return Promise.resolve({ data: null, error: { message: (e && e.message) || String(e) } }); }
  }
  match(r){ return this.f.every(([k, v]) => r[k] === v || (r[k] != null && String(r[k]) === String(v))); }
  build(row){
    const t = this.t, now = nowISO(), o = {};
    for (const c of COLS[t]) o[c] = null;
    Object.assign(o, DEFAULTS[t] || {});
    for (const k of COLS[t]) if (k !== 'id' && row[k] !== undefined) o[k] = clone(row[k]);
    o.id = ++STORE.db.seq[t];
    if (!o.created_at) o.created_at = now;
    if (COLS[t].includes('updated_at') && !row.updated_at) o.updated_at = now;
    return o;
  }
  exec(){
    const tbl = STORE.db.tables[this.t];
    if (!tbl) throw new Error('未知表 ' + this.t);
    if (this.op === 'select'){
      let out = tbl.filter(r => this.match(r));
      if (this.ord){ const [k, asc] = this.ord; out = out.slice().sort((a, b) => { let c = cmp(a[k], b[k]); if (c === 0) c = cmp(a.id, b.id); return asc ? c : -c; }); }
      if (this.cols && this.cols !== '*'){ const list = this.cols.split(',').map(x => x.trim()); out = out.map(r => { const o = {}; list.forEach(k => o[k] = r[k]); return o; }); }
      return clone(out);
    }
    if (this.op === 'insert'){
      const made = (Array.isArray(this.pl) ? this.pl : [this.pl]).map(r => this.build(r));
      tbl.push(...made); touch();
      return this.rows ? clone(made) : null;
    }
    if (this.op === 'update'){
      const hit = tbl.filter(r => this.match(r));
      for (const r of hit){
        for (const k of COLS[this.t]) if (k !== 'id' && this.pl[k] !== undefined) r[k] = clone(this.pl[k]);
        if (COLS[this.t].includes('updated_at') && this.pl.updated_at === undefined) r.updated_at = nowISO();
      }
      touch(); return this.rows ? clone(hit) : null;
    }
    if (this.op === 'delete'){
      STORE.db.tables[this.t] = tbl.filter(r => !this.match(r)); touch(); return null;
    }
  }
}
const T = name => new Q(name);
async function must(p, label){
  const { data, error } = await p;
  if (error){
    const txt = errText(error);
    toast((label || '操作失败') + '：' + txt.split('\n')[0]);
    const w = new Error((label ? label + '失败\n' : '') + txt); w.raw = error; throw w;
  }
  return data;
}

/* ========== 口令（4 位数字） ========== */
const CODE_LEN = 4;
const normCode = s => String(s || '').replace(/\D/g, '').slice(0, CODE_LEN);
const validCode = c => new RegExp('^\\d{' + CODE_LEN + '}$').test(c);
const formatCode = c => String(c || '');
/* 4 位数字的取值空间很小，用 PBKDF2 拉高每次猜测的成本（不是为了加密强度，是为了让穷举变慢） */
async function hashCode(code){
  if (!(window.crypto && crypto.subtle)) throw new Error('当前浏览器环境不支持加密接口，请使用 https 地址打开');
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name:'PBKDF2', salt: enc.encode('puppy-archive/v2'), iterations: 210000, hash:'SHA-256' }, key, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove(); }
}

/* ========== 云端同步（后台进行，界面永远不等它） ========== */
const SYNC = { state:'idle', busy:false, again:false, pullAgain:false, timer:null, lastErr:'' };
function syncLabel(){
  return ({ ok:'已同步', syncing:'同步中…', pending:'待同步', fail:'未同步，稍后自动重试', off:'仅本机（云端不可用）' })[SYNC.state] || '';
}
function setSync(st){
  SYNC.state = st;
  document.querySelectorAll('[data-sync]').forEach(el => { el.textContent = syncLabel(); el.style.color = st === 'fail' ? 'var(--bad)' : ''; });
}
function scheduleSync(ms, opts){ clearTimeout(SYNC.timer); SYNC.timer = setTimeout(() => syncNow(opts || {}), ms); }

async function rpcRetry(fn, args){
  let last;
  for (let i = 0; i < 3; i++){
    let res;
    try { res = await cloud.database.rpc(fn, args); }
    catch (e) { last = e; await sleep(700 * (i + 1)); continue; }
    const { data, error, status } = res || {};
    if (!error) return data;
    last = error;
    const code = Number(error.code), st = Number(status);
    const transient = !st || st >= 500 || (code >= 500 && code < 600);
    if (!transient) break;
    await sleep(700 * (i + 1));
  }
  const w = new Error(errText(last)); w.raw = last; throw w;
}
async function vaultGet(hash){
  const rows = await rpcRetry('vault_get', { p_hash: hash });
  return (rows && rows[0]) || null;
}
async function vaultPut(hash, db, base){
  const rows = await rpcRetry('vault_put', { p_hash: hash, p_data: db, p_base_rev: base });
  return rows && rows[0];
}
function backup(side, db){ try { localStorage.setItem('pa_backup', JSON.stringify({ at: nowISO(), side, db })); } catch (e) {} }
async function adoptRemote(remote){
  STORE.db = normDB(clone(remote.data)); STORE.rev = remote.rev; STORE.dirty = false; STORE.ver = (STORE.ver || 0) + 1; saveStore();
  if (!$('#app').classList.contains('hide') && $('#modalRoot').innerHTML === ''){ await loadDogs(); toast('已从云端更新'); }
}
async function resolveConflict(remote){
  const pick = await showMenu('同步冲突', [
    { label:'用云端的版本', icon:'☁', hint:'本机未同步的修改会先备份，再丢弃', run: async () => { backup('local', STORE.db); await adoptRemote(remote); } },
    { label:'用本机的版本', icon:'📱', hint:'覆盖云端，云端那份先备份在本机', run: async () => { backup('cloud', remote.data); await pushLocal(remote.rev); } }
  ]);
  if (pick && pick.run) return pick.run();
  scheduleSync(15000);
}
async function pushLocal(base){
  const v = STORE.ver, snap = canon(STORE.db);
  const r = await vaultPut(STORE.hash, STORE.db, base);
  if (r && r.ok){
    STORE.rev = r.rev; if (STORE.ver === v) STORE.dirty = false; saveStore();
    if (STORE.dirty) scheduleSync(300);
    return;
  }
  const remote = await vaultGet(STORE.hash);
  if (!remote) return pushLocal(0);
  if (canon(remote.data) === snap){ STORE.rev = remote.rev; if (STORE.ver === v) STORE.dirty = false; saveStore(); return; }  // 上次响应丢了，其实已写入
  if (remote.rev < base) return pushLocal(remote.rev);
  await resolveConflict(remote);
}
async function syncNow(opts){
  opts = opts || {};
  if (!STORE) return;
  if (!cloud){ setSync('off'); return; }
  if (SYNC.busy){ SYNC.again = true; if (opts.pull) SYNC.pullAgain = true; return; }
  SYNC.busy = true; setSync('syncing');
  try {
    if (opts.pull || STORE.rev === 0){
      const remote = await vaultGet(STORE.hash);
      if (!remote) await pushLocal(0);
      else if (remote.rev > STORE.rev){ if (!STORE.dirty) await adoptRemote(remote); else await resolveConflict(remote); }
      else if (remote.rev === STORE.rev){ if (STORE.dirty) await pushLocal(STORE.rev); }
      else await pushLocal(remote.rev);
    } else if (STORE.dirty){
      await pushLocal(STORE.rev);
    }
    STORE.syncedAt = Date.now(); saveStore();
    setSync(STORE.dirty ? 'pending' : 'ok');
  } catch (e) {
    SYNC.lastErr = errText(e); setSync('fail'); scheduleSync(20000);
  } finally {
    SYNC.busy = false;
    if (SYNC.again){ const pl = SYNC.pullAgain; SYNC.again = false; SYNC.pullAgain = false; scheduleSync(400, { pull: pl }); }
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && STORE) scheduleSync(300, { pull: true }); });
window.addEventListener('online', () => { if (STORE) scheduleSync(300, { pull: true }); });

function fail(msg){
  const app = $('#app');

    return;
  }

  const st = $('#lgStatus'); if (st) st.classList.add('hide');

/* 出错时绝不留白屏：把原因画到页面上 */

    <b>页面出错了</b>

window.addEventListener('error', e => { if (e && e.message) console.error(e.message); });
window.addEventListener('unhandledrejection', e => { console.error(e && e.reason); });

function showCodeModal(code, onDone, doneText){

    <div class="card" id="rcShow" style="text-align:center;font-size:40px;letter-spacing:.24em;font-weight:700;font-family:ui-monospace,Menlo,monospace;user-select:all;padding:14px 0">${esc(formatCode(code))}</div>

/* 新建：口令由用户自己定，留空则随机给一个 */
function newCodePrompt(prefill){
  return new Promise(resolve => {
    const root = $('#modalRoot');
    root.innerHTML = `<div class="modal"><div class="sheet">
      <h3>设一个 4 位数字口令</h3>
      <p class="sub">用它找回档案。自己记得住就行，别用生日、手机号后四位这类别人容易猜到的。</p>
      <input class="code" id="newCode" type="tel" inputmode="numeric" maxlength="4" placeholder="4 位数字" value="${esc(prefill || '')}" autocomplete="off">
      <p class="sub" id="newCodeMsg" style="margin:8px 0 0"></p>
      <div class="row" style="margin-top:12px">
        <button class="btn grow" id="ncCancel" type="button">取消</button>
        <button class="btn pri grow" id="ncOk" type="button">确定</button>
      </div>
    </div></div>`;
    const inp = $('#newCode'); if (!prefill) setTimeout(() => inp.focus(), 50);
    let done = false;
    const finish = v => { if (done) return; done = true; dropModal(); resolve(v); };
    pushLayer(v => finish(v === undefined ? null : v), 'form');   // 系统返回 = 取消
    const close = v => { if (!closeLayerOf('form', v)) finish(v); };
    $('#ncCancel').onclick = () => close(null);
    $('#ncOk').onclick = async () => {
      const c = normCode(inp.value);
      if (!validCode(c)) return ($('#newCodeMsg').textContent = '要 4 位数字，例如 8351');
      const btn = $('#ncOk'); btn.disabled = true; $('#newCodeMsg').textContent = '正在检查这个口令是否已被占用…';
      try {
        if (cloud){
          const probe = vaultGet(await hashCode(c)).catch(() => null);
          const hits = await Promise.race([probe, sleep(2500).then(() => 'timeout')]);
          if (hits && hits !== 'timeout' && hits.rev){ btn.disabled = false; $('#newCodeMsg').textContent = '这个口令已经有档案了，换一个，或者用“找回档案”进去。'; return; }
        }
      } catch (e) { /* 云端暂时不通也允许继续，本机先记下，同步会重试 */ }
      close(c);
    };
  });
}
function wireStart(){
  $('#rcInput').addEventListener('input', e => { e.target.value = normCode(e.target.value); });
  $('#btnNew').onclick = async () => {
    try {
      const pre = normCode($('#rcInput').value);
      const code = await newCodePrompt(validCode(pre) ? pre : '');
      if (!code) return;
      const hash = await hashCode(code);
      const keep = UPGRADING && STORE && STORE.db && Object.values(STORE.db.tables).some(a => a.length);   // 旧口令升级：留着本机数据
      STORE = { code, hash, rev:0, dirty:true, ver:1, syncedAt:0, db:keep ? STORE.db : emptyDB() };
      UPGRADING = false;
      saveStore(); setSync(cloud ? 'pending' : 'off');
      showCodeModal(code, () => enterApp());
      scheduleSync(100);
    } catch (e) { fail('新建失败：' + errText(e)); }
  };
  $('#btnRestore').onclick = async () => {
    const msg = $('#rcMsg'), btn = $('#btnRestore'); $('#lgErr').textContent = '';
    const c = normCode($('#rcInput').value);
    if (!validCode(c)) return fail('请输入 4 位数字口令');
    if (!cloud) return fail('云端组件没有加载成功，请刷新页面后重试');
    btn.disabled = true; msg.textContent = '正在向云端查找（云端偶尔较慢，最多约 30 秒）…';
    try {
      const hash = await hashCode(c), remote = await vaultGet(hash);
      if (!remote){ msg.textContent = ''; return fail('没有找到这个口令对应的档案，请检查数字是否输错。'); }
      STORE = { code:c, hash, rev:remote.rev, dirty:false, ver:1, syncedAt:Date.now(), db:normDB(clone(remote.data)) };
      saveStore(); msg.textContent = ''; setSync('ok');
      await enterApp();
    } catch (e) { msg.textContent = ''; fail('找回失败：' + errText(e) + netDiag()); }
    finally { btn.disabled = false; }
  };
}
async function boot(){
  await window.__sdkReady;   /* 等 SDK 就绪；仅本机模式立即返回 */
  try { if (cloudReady && typeof WorkBuddyCloud !== 'undefined') cloud = WorkBuddyCloud.createWorkBuddyCloud(publicConfig); }
  catch (e) { console.error(e); cloud = null; }
  bindGestures();
  wireStart();
  try {   // 清掉旧版登录回调留下的参数
    const u = new URL(location.href); let ch = false;
    for (const k of ['code','state','provider','error']) if (u.searchParams.has(k)){ u.searchParams.delete(k); ch = true; }
    if (ch) history.replaceState(null, '', u.pathname + u.search + u.hash);
  } catch (e) {}
  STORE = loadStore();
  if (!STORE){ $('#lgStatus').classList.add('hide'); $('#lgBody').classList.remove('hide'); return; }
  if (!validCode(STORE.code)){ upgradeCode(); return; }   // 旧格式：先换口令，不丢数据
  setSync(!cloud ? 'off' : STORE.dirty ? 'pending' : 'ok');
  await enterApp();
  scheduleSync(200, { pull: true });
}

/* 用户手动调整过的顺序（sort）优先，其余保持查询顺序（sort 为稳定排序，不会打乱默认次序） */
const applySort = list => list.slice().sort((a, b) => (a.sort == null ? 1e9 : a.sort) - (b.sort == null ? 1e9 : b.sort));

  const form = root.querySelector('form');
  pushLayer(() => dropModal(), 'form');     // 系统返回也能关掉表单
  root.querySelector('[data-close]').onclick = closeModal;
  root.querySelector('.modal').onclick = e => { if (e.target.classList.contains('modal')) closeModal(); };
  form.onsubmit = async e => {
    e.preventDefault();
    const out = {};
    for (const f of fields){
      if (f.type === 'checks') out[f.k] = [...form.querySelectorAll(`input[name="${f.k}"]:checked`)].map(i => i.value);
      else out[f.k] = form.elements[f.k].value.trim();
    }
    try { await onSubmit(out); closeModal(); } catch (_) { /* 已提示 */ }
  };
}
/* 表单弹窗：只清 DOM；关栈交给下面的 closeModal */
function dropModal(){ const r = $('#modalRoot'); if (r) r.innerHTML = ''; }
function closeModal(){
  while (LAYERS.length && LAYERS[LAYERS.length - 1].kind === 'dlg') popLayer();
  if (!closeLayerOf('form')) dropModal();
}
/* ========== 返回键：弹窗 / 详情压一层 history，系统返回先关它们 ========== */
const LAYERS = [];
let selfPop = 0;
function pushLayer(close, kind){
  LAYERS.push({ close, kind });
  try { history.pushState({ paLayer: LAYERS.length }, '', location.href); } catch (_) {}
}
/* 界面自己关掉时：先退掉这层 history，再执行真正的关闭 */
function popLayer(value){
  const l = LAYERS.pop();
  if (!l) return false;
  selfPop++;
  try { history.back(); } catch (_) {}
  try { l.close(value); } catch (err) { console.error(err); }
  return true;
}
/* 只在栈顶正好是这一类界面时才退栈，避免把别的层一起关掉 */
function closeLayerOf(kind, value){
  const top = LAYERS[LAYERS.length - 1];
  if (top && top.kind === kind) return popLayer(value);
  return false;
}
function dropSessionLayer(){
  while (LAYERS.length && LAYERS[LAYERS.length - 1].kind === 'session') popLayer();
}
/* 关掉某一局的详情，回到局列表 */
function closeSessionView(){ S.openSession = null; S.tab = 'sessions'; render(); }
window.addEventListener('popstate', () => {
  if (selfPop){ selfPop--; return; }
  const l = LAYERS.pop();
  if (l){ try { l.close(undefined); } catch (err) { console.error(err); } }
});

function confirmBox(msg, opts){

      <div class="row" style="margin-top:18px"><button class="btn grow" data-no>${esc(opts.cancel || '取消')}</button>
      <button class="btn grow ${opts.soft ? 'solid-ok' : 'solid-bad'}" data-yes>${esc(opts.ok || '确定')}</button></div>`);

    let done = false;

    pushLayer(v => fin(v === undefined ? null : v), 'dlg');   // 系统返回 = 关掉
    const pick = v => { if (Date.now() - t0 < 260) return; if (!closeLayerOf('dlg', v)) fin(v); };
    r.querySelectorAll('[data-i]').forEach(b => b.onclick = () => pick(items[Number(b.dataset.i)]));
    r.querySelector('[data-no]').onclick = () => pick(null);

/* ========== 左滑操作 / 长按拖动排序 ========== */
const GEST = { el:null, pid:null, x0:0, y0:0, dx:0, base:0, axis:'', timer:0, suppress:0 };
const DRAG = { on:false, g:null, ghost:null, y0:0, grp:'' };
const swipeWidth = g => { const a = g.querySelector('.g-act'); return a ? a.offsetWidth : 0; };
function closeSwipe(except){
  document.querySelectorAll('.gest.open').forEach(g => {
    if (g === except) return;
    g.classList.remove('open');
    const inner = g.querySelector('.g-in'); if (inner) inner.style.transform = '';
  });
}
/* 同组 = 同一分类下的这些行，只有同组之间可以换位置 */
const dragGroup = grp => Array.from(document.querySelectorAll('.gest[data-grp]'))
  .filter(el => el.dataset.grp === grp && !el.classList.contains('drag-ghost'));

function startDrag(g, y){
  if (DRAG.on || !g.dataset.grp) return;
  closeSwipe();
  const rect = g.getBoundingClientRect();
  const ghost = g.cloneNode(true);
  ghost.className = 'gest drag-ghost' + (g.classList.contains('plain') ? ' plain' : '');
  ghost.removeAttribute('data-grp');
  ghost.style.width = rect.width + 'px';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  document.body.appendChild(ghost);
  g.classList.add('drag-src');
  DRAG.on = true; DRAG.g = g; DRAG.ghost = ghost; DRAG.y0 = y; DRAG.grp = g.dataset.grp;
  document.body.classList.add('dragging-row');
  try { if (navigator.vibrate) navigator.vibrate(12); } catch (_) {}
}
function dragMove(y){
  if (!DRAG.on) return;
  DRAG.ghost.style.transform = `translateY(${y - DRAG.y0}px)`;
  const edge = 68;                                  // 靠近上下边缘时自己滚
  if (y < edge) window.scrollBy(0, -14);
  else if (y > window.innerHeight - edge) window.scrollBy(0, 14);
  const g = DRAG.g, list = dragGroup(DRAG.grp).filter(el => el !== g);
  if (!list.length) return;
  let ref = null;
  for (const el of list){
    const r = el.getBoundingClientRect();
    if (y < r.top + r.height * 0.55){ ref = el; break; }
  }
  if (ref){ if (g.nextElementSibling !== ref) g.parentElement.insertBefore(g, ref); }
  else {
    const last = list[list.length - 1];
    if (g.previousElementSibling !== last) last.parentElement.insertBefore(g, last.nextSibling);
  }
}
async function endDrag(){
  if (!DRAG.on) return;
  const g = DRAG.g;
  DRAG.on = false;
  if (DRAG.ghost) DRAG.ghost.remove();
  DRAG.ghost = null;
  g.classList.remove('drag-src');
  document.body.classList.remove('dragging-row');
  GEST.suppress = Date.now();
  const table = { fact:'facts', event:'events', session:'sessions', skill:'dog_skills' }[g.dataset.g];
  const ids = dragGroup(DRAG.grp).map(el => Number(el.dataset.gid)).filter(n => n);
  if (!table || ids.length < 2) return;
  try { await commitOrder(table, ids); } catch (err) { console.error(err); }
}
function bindGestures(){
  document.addEventListener('pointerdown', e => {
    if (e.button > 0 || DRAG.on) return;
    const g = e.target.closest('.gest');
    if (!g){ clearTimeout(GEST.timer); GEST.el = null; closeSwipe(); return; }
    if (e.target.closest('button,input,select,textarea,label,a')) return;
    closeSwipe(g);
    GEST.el = g; GEST.pid = e.pointerId; GEST.x0 = e.clientX; GEST.y0 = e.clientY; GEST.dx = 0; GEST.axis = '';
    GEST.base = g.classList.contains('open') ? -swipeWidth(g) : 0;
    clearTimeout(GEST.timer);
    /* 按住 420ms 不动：卡片被“拿起来”，接着上下拖就是排序 */
    GEST.timer = setTimeout(() => {
      if (GEST.el !== g || GEST.axis) return;
      GEST.el = null;
      g.classList.add('pressing'); setTimeout(() => g.classList.remove('pressing'), 160);
      startDrag(g, GEST.y0);
    }, 420);
  });
  document.addEventListener('pointermove', e => {
    if (DRAG.on){ dragMove(e.clientY); return; }
    const g = GEST.el;
    if (!g || e.pointerId !== GEST.pid) return;
    const dx = e.clientX - GEST.x0, dy = e.clientY - GEST.y0;
    if (!GEST.axis){
      if (Math.abs(dx) > 9 && Math.abs(dx) > Math.abs(dy) * 1.15){ GEST.axis = 'x'; clearTimeout(GEST.timer); g.classList.add('dragging'); }
      else if (Math.abs(dy) > 12){ clearTimeout(GEST.timer); GEST.axis = 'y'; GEST.el = null; return; }
    }
    if (GEST.axis === 'x'){
      const w = swipeWidth(g);
      GEST.dx = Math.max(-w, Math.min(0, GEST.base + dx));
      const inner = g.querySelector('.g-in');
      if (inner) inner.style.transform = `translateX(${GEST.dx}px)`;
    }
  }, { passive: true });
  /* 拖动时必须自己拦下滚动，否则页面会跟着一起滚 */
  document.addEventListener('touchmove', e => {
    if (!DRAG.on || !e.touches[0]) return;
    e.preventDefault();
    dragMove(e.touches[0].clientY);
  }, { passive: false });
  const end = () => {
    clearTimeout(GEST.timer);
    if (DRAG.on){ endDrag(); return; }
    const g = GEST.el; GEST.el = null;
    if (!g) return;
    g.classList.remove('dragging');
    if (GEST.axis !== 'x') return;
    const w = swipeWidth(g), inner = g.querySelector('.g-in');
    const open = GEST.dx < -w * 0.4;
    g.classList.toggle('open', open);
    if (inner) inner.style.transform = open ? `translateX(${-w}px)` : '';
    GEST.suppress = Date.now();
  };
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
  /* 桌面端：右键开菜单；手机长按触发的 contextmenu 直接吞掉，拖动时更不能弹 */
  document.addEventListener('contextmenu', e => {
    const g = e.target.closest('.gest');
    if (!g) return;
    e.preventDefault();
    if (DRAG.on) return;
    if ($('#dlgRoot') && $('#dlgRoot').innerHTML) return;
    openRowMenu(g.dataset.g, Number(g.dataset.gid));
  });
}
function rowMenuItems(type, id){

    return [

      { label:'删除这条', icon:'🗑', cls:'bad', run:() => actions.delFact(id) }
    ];
  }
  if (type === 'event'){
    const e = S.events.find(x => x.id === id); if (!e) return [];
    const items = [{ label:'编辑', icon:'✎', run:() => actions.editEvent(id) }];
    if (e.kind === 'todo') items.push({ label: e.done ? '标记为未完成' : '标记为完成', icon: e.done ? '↺' : '✓', run:() => actions.toggleTodoBy(id) });
    return items.concat([
      { label:'删除', icon:'🗑', cls:'bad', run:() => actions.delEvent(id) }
    ]);
  }
  if (type === 'session'){
    return [
      { label:'打开这一局', icon:'↗', run:() => actions.openSession(id) },
      { label:'编辑', icon:'✎', run:() => actions.editSession(id) },
      { label:'删除', icon:'🗑', cls:'bad', run:() => actions.delSession(id) }
    ];
  }
  if (type === 'skill'){

    return items;
  }
  return [];
}
async function openRowMenu(type, id){
  const items = rowMenuItems(type, id);
  if (!items.length) return;
  const title = { fact:'这条信息', event:'这条事件', session:'这一局', skill:'这个节点' }[type] || '';
  const pick = await showMenu(title, items);
  if (!pick || !pick.run) return;
  try { await pick.run(); } catch (err) { console.error(err); }
}
/* 拖完之后按屏幕上的新顺序写回 sort：只占用这组行原来的那几个序号，不影响别的分组 */
async function commitOrder(table, ids){
  const key = { facts:'facts', events:'events', sessions:'sessions', dog_skills:'skills' }[table];
  const all = S[key] || [];
  const rows = ids.map(id => all.find(x => x.id === id)).filter(Boolean);
  if (rows.length < 2) return;
  const hasSort = rows.every(r => typeof r.sort === 'number');
  const slots = hasSort ? rows.map(r => r.sort).sort((a, b) => a - b) : rows.map((_, i) => i);
  const changed = [];
  rows.forEach((r, i) => { if (r.sort !== slots[i]) changed.push([r.id, slots[i]]); });
  if (!changed.length) return;
  for (const [id, sort] of changed) await must(T(table).update({ sort }).eq('id', id), '调整顺序');
  await loadAll();
}

/* ========== 交互 ========== */
document.addEventListener('click', async e => {
  /* 手势刚结束时的那一下点击不算数，避免滑完/长按后误触 */
  if (Date.now() - GEST.suppress < 350 && e.target.closest('.gest .g-in')){ e.preventDefault(); e.stopPropagation(); return; }
  /* 点在已滑开的行上：先收起，不触发原本的点击 */
  if (e.target.closest('.gest.open .g-in')){ closeSwipe(); e.preventDefault(); e.stopPropagation(); return; }
  /* 点了滑出的按钮：动作执行前先收起 */
  if (e.target.closest('.g-act')) closeSwipe();
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn){ S.tab = tabBtn.dataset.tab; if (S.tab !== 'sessions' && S.openSession){ dropSessionLayer(); S.openSession = null; } render(); window.scrollTo(0,0); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.type === 'checkbox'){ /* 交给 change 事件 */ return; }
  const act = el.dataset.act, id = Number(el.dataset.id);
  if (el.tagName === 'A') e.preventDefault();
  try { await actions[act]?.(id, el); } catch (err) { console.error(err); }
});
document.addEventListener('change', async e => {
  const el = e.target.closest('[data-act="toggleTodo"]');
  if (el) { try { await actions.toggleTodo(Number(el.dataset.id), el); } catch(_){} }
});

  async delSession(id){
    const s = S.sessions.find(x => x.id === id) || (S.openSession && S.openSession.id === id ? S.openSession : null);
    const ok = await confirmBox(`删除${s ? '「' + (s.seq ? '第 ' + s.seq + ' 局' : (s.type === 'chat' ? '聊天记录' : '局')) + ' · ' + (s.session_date || '') + '」' : '这一局'}的全部记录？\n\n聊天记录和平台报告会一起删掉，云端也会删。`, { title:'删除局记录', ok:'删除' });
    if (!ok) return;
    await must(T('sessions').delete().eq('id',id), '删除'); dropSessionLayer(); S.openSession = null; closeSwipe(); await loadAll();
  },
  async chatSession(id){
    openForm({ title:'导入聊天记录', submitText:'导入', fields:[
      { k:'text', label:'粘贴文本，每行一条', type:'textarea', h:220, ph:'以“我：”开头的行算作你，其余算作她。' },
      { k:'mode', label:'导入方式', type:'select', options:[['replace','覆盖已有聊天'],['append','追加到已有聊天']] }],
      onSubmit: async v => {
        const msgs = v.text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
          const m = l.match(/^(我|主人)[:：]\s*(.*)$/); return m ? { who:'me', text:m[2] } : { who:'dog', text:l.replace(/^(她|对方)[:：]\s*/,'') };
        });
        const cur = S.openSession && S.openSession.id === id && Array.isArray(S.openSession.chat) ? S.openSession.chat : [];
        const chat = v.mode === 'append' ? cur.concat(msgs) : msgs;
        await must(T('sessions').update({ chat, updated_at:nowISO() }).eq('id',id), '导入');
        await actions.openSession(id); await loadAll(); S.tab='sessions'; render();
      } });
  },

  /* 待确认 */
  async approvePending(id){
    const p = S.pending.find(x => x.id === id);
    const ok = ['facts','dog_skills','sessions','events'];
    if (!ok.includes(p.target_table)) return toast('不支持的目标表');
    const payload = { ...p.payload }; delete payload.id; delete payload.owner_id; delete payload.dog_id;
    if (p.action === 'update'){
      if (!p.target_id) return toast('缺少目标 id');
      payload.updated_at = nowISO();
      await must(T(p.target_table).update(payload).eq('id',p.target_id).eq('dog_id',S.dog.id), '写入');
    } else {
      await must(T(p.target_table).insert({ ...payload, dog_id:S.dog.id }), '写入');
    }
    await must(T('pending').update({ status:'approved', resolved_at:nowISO() }).eq('id',id), '更新队列');
    toast('已写入档案'); await loadAll();
  },
  async rejectPending(id){
    await must(T('pending').update({ status:'rejected', resolved_at:nowISO() }).eq('id',id), '更新队列'); await loadAll();
  },

  /* 导出导入 */
  async exportDog(){
    const d = S.dog;
    const sessions = await must(T('sessions').select('*').eq('dog_id',d.id), '读取局记录');
    const att = await must(T('attachments').select('*').eq('dog_id',d.id), '读取附件');
    const data = { schema:'puppy-archive/1', exported_at:nowISO(), dog:d, facts:S.facts, dog_skills:S.skills, sessions, events:S.events, pending:S.pending, attachments:att };
    download(`${d.code}.json`, JSON.stringify(data, null, 2));
    toast('已导出');
  },
  exportTemplate(){ download('puppy-archive-template.json', JSON.stringify(TEMPLATE, null, 2)); },
  importFile(){
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      try { await importJSON(JSON.parse(await f.text())); } catch (err) { console.error(err); toast('导入失败：'+errText(err)); }
    };
    inp.click();
  },
  viewCode(){
    if (!STORE) return;
    showCodeModal(STORE.code, null, '关闭');
  },
  toggleCode(){ S.showCode = !S.showCode; render(); },
  async syncNow(){
    if (!cloud) return toast('云端组件没加载成功，刷新页面再试');
    setSync('syncing'); toast('正在同步…');
    await syncNow({ pull: true });
    toast(syncLabel());
  },
  exportAll(){
    download('puppy-archive-backup-' + today() + '.json', JSON.stringify({ schema:'puppy-archive-db/1', db:STORE.db }, null, 2));
    toast('已导出备份');
  },
  async wipeLocal(){
    const ok = await confirmBox('清除这台设备上的档案数据？\n\n云端那份不动，之后在启动页输入口令就能找回。建议先“导出全部备份”。', { title:'清除本机数据', ok:'清除' });
    if (!ok) return;
    localStorage.removeItem(LS_KEY); localStorage.removeItem('dogId');
    STORE = null; location.reload();
  },
  dismissHint(){ S.hintOff = true; localStorage.setItem('pa_hint_off', '1'); render(); },
  reload(){ location.reload(); }
};

function sessionForm(s){
  const skillOpts = S.skills.map(k => [k.skill_key, k.name]);
  openForm({ title: s ? '编辑局' : '添加局', fields:[
    { k:'seq', label:'第几局（纯聊天留空，不计局）', type:'number' }, { k:'session_date', label:'日期', type:'date' },
    { k:'type', label:'类型', type:'select', options:Object.entries(TYPE_N) },
    { k:'format', label:'形式', ph:'如：我语音、她打字' }, { k:'env', label:'环境', ph:'如：宿舍，不能出声' },
    { k:'duration_min', label:'时长（分钟）', type:'number' },
    { k:'summary', label:'摘要', type:'textarea', ph:'客观记录发生了什么' },
    { k:'skills_used', label:'用到的玩法', type:'checks', options:skillOpts },
    { k:'report', label:'平台报告（每行“键: 值”）', type:'textarea', ph:'时长: 94:00' }],
    initial: s ? { ...s, report: s.report && typeof s.report==='object' ? Object.entries(s.report).map(([k,v])=>`${k}: ${v}`).join('\n') : '' } : { type:'play', session_date:today(), seq:S.sessions.filter(x => x.type === 'play').length + 1 },
    onSubmit: async v => {
      const report = {}; v.report.split('\n').forEach(l => { const m = l.match(/^\s*([^:：]+)[:：]\s*(.*)$/); if (m) report[m[1].trim()] = m[2].trim(); });
      const row = { seq:v.seq?Number(v.seq):null, session_date:nul(v.session_date), type:v.type, format:nul(v.format), env:nul(v.env), duration_min:v.duration_min?Number(v.duration_min):null, summary:nul(v.summary), skills_used:v.skills_used, report:Object.keys(report).length?report:null };
      if (s){ row.updated_at = nowISO(); await must(T('sessions').update(row).eq('id',s.id), '保存'); if (S.openSession && S.openSession.id === s.id) S.openSession = { ...S.openSession, ...row }; }
      else await must(T('sessions').insert({ ...row, dog_id:S.dog.id }), '保存');
      await loadAll();
    } });
}

function download(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type:'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

const strip = (row, drop = []) => { const o = { ...row }; for (const k of ['id','owner_id','created_at',...drop]) delete o[k]; return o; };
async function importJSON(j){
  if (j && j.schema === 'puppy-archive-db/1' && j.db){
    if (!await confirmBox('这是完整备份。导入会用它的全部内容替换本机当前的档案（当前数据会先在本机留一份备份）。', { title:'导入完整备份', ok:'替换' })) return;
    backup('before-import', STORE.db);
    STORE.db = normDB(clone(j.db)); touch(); localStorage.removeItem('dogId');
    toast('已导入完整备份'); await loadDogs(); return;
  }
  if (!j || !j.dog) throw new Error('缺少 dog 字段');
  const code = j.dog.code;
  const dogs = await must(T('dogs').insert({ code, real_name:j.dog.real_name||null, status:j.dog.status||'active', note:j.dog.note||null }).select(), '建档');
  const dogId = dogs[0].id;
  const withDog = rows => (rows||[]).map(r => ({ ...strip(r, ['dog_id','session_id']), dog_id:dogId }));
  if (j.dog_skills?.length) await must(T('dog_skills').insert(withDog(j.dog_skills)), '导入技能');
  else await must(T('dog_skills').insert(TEMPLATE.skills.map(s => ({ dog_id:dogId, skill_key:s.k, level:s.lv, name:s.name }))), '初始化技能');
  const sessionMap = {};
  for (const s of (j.sessions||[])){
    const r = await must(T('sessions').insert({ ...strip(s, ['dog_id']), dog_id:dogId }).select(), '导入局');
    sessionMap[s.id] = r[0].id;
  }
  const remap = rows => (rows||[]).map(r => ({ ...strip(r, ['dog_id','session_id']), dog_id:dogId, session_id: r.session_id ? (sessionMap[r.session_id] || null) : null }));
  if (j.facts?.length) await must(T('facts').insert(remap(j.facts)), '导入信息');
  if (j.events?.length) await must(T('events').insert(remap(j.events)), '导入事件');
  if (j.pending?.length) await must(T('pending').insert(withDog(j.pending)), '导入队列');
  localStorage.setItem('dogId', dogId);
  toast('导入完成'); await loadDogs();
}

boot().catch(e => fail('初始化失败：' + errText(e)));
</script>
